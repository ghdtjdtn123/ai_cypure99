    <style>
      :root {
        --font-sans: "Pretendard Variable", "Pretendard", "Outfit", -apple-system,

        --font-display: "Outfit", "Pretendard Variable", "Pretendard", sans-serif;
      }

      html {
        font-family: var(--font-sans);
        color: #1e1633;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background-color: #f6f3ff;
        background-image:
          radial-gradient(at 15% 10%, rgba(167, 139, 250, 0.18) 0px, transparent 48%),
          radial-gradient(at 88% 85%, rgba(196, 181, 253, 0.22) 0px, transparent 50%);
        background-attachment: fixed;
        overflow-x: hidden;
      }

      .font-display {
        font-family: var(--font-display);
      }

      .text-balance {
        text-wrap: balance;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes bounceSelect {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.038);
        }
        70% {
          transform: scale(0.985);
        }
        100% {
          transform: scale(1.015);
        }
      }

      .animate-enter {
        animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-bounce-select {
        animation: bounceSelect 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .option-card {
        transition:
          transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.18s ease,
          background-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .option-card:hover:not(:disabled) {
        transform: translateY(-3px) scale(1.015);
      }

      .option-card:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn-bouncy {
        transition:
          transform 0.16s cubic-bezier(0.16, 1, 0.3, 1),
          background-color 0.16s ease;
      }

      .btn-bouncy:hover {
        transform: scale(1.015);
      }

      .btn-bouncy:active {
        transform: scale(0.96);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

      function calculateQuizResult(selectedRoles) {
        const counts = { planning: 0, dev: 0, design: 0, data: 0 };
        const lastIndexSeen = { planning: -1, dev: -1, design: -1, data: -1 };

        selectedRoles.forEach((role, idx) => {
          counts[role] += 1;
          lastIndexSeen[role] = idx;
        });

        const sortedRoles = [...ROLE_ORDER].sort((a, b) => {
          if (counts[b] !== counts[a]) return counts[b] - counts[a];
          return lastIndexSeen[b] - lastIndexSeen[a];
        });

        const total = Math.max(selectedRoles.length, 1);
        const breakdown = sortedRoles.map((role) => ({
          role,
          title: ROLE_PROFILES[role].title,
          percentage: Math.round((counts[role] / total) * 100),
        }));

        return { primary: ROLE_PROFILES[sortedRoles[0]], breakdown };
      }

            <div class="bg-white rounded-3xl px-5 py-4 sm:px-7 sm:py-5 shadow-[0_10px_30px_-14px_rgba(109,40,217,0.14)]">
              <div class="flex items-center justify-between gap-4 mb-3">
                <div class="flex items-center gap-3 min-w-0">
                  ${
                    state.currentIndex > 0
                      ? `<button id="prev-question-btn" type="button" class="min-h-[40px] min-w-[40px] -ml-2 px-2.5 rounded-xl text-sm font-medium text-[#5D507C] hover:text-violet-700 hover:bg-violet-50 inline-flex items-center gap-1 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-600 whitespace-nowrap shrink-0">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6-6-6 6 6 6" />
                          </svg>
                          <span>이전</span>
                        </button>`
                      : `<span class="min-h-[40px] inline-flex items-center text-sm font-medium text-[#6B6088]">진행도</span>`
                  }
                </div>

                <div class="font-display text-sm sm:text-base font-semibold text-violet-700 tabular-nums whitespace-nowrap shrink-0">
                  ${state.currentIndex + 1}/${total}
                </div>
              </div>

              <div class="w-full h-2.5 bg-violet-100 rounded-full overflow-hidden" role="progressbar" aria-valuenow="${state.currentIndex + 1}" aria-valuemin="1" aria-valuemax="${total}">
                <div class="h-full bg-violet-600 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
              </div>
            </div>

            <div class="flex flex-col gap-4 sm:gap-5 animate-enter">
              <div class="bg-white rounded-[28px] p-6 sm:p-9 shadow-[0_14px_40px_-16px_rgba(109,40,217,0.16)]">
                <div class="flex items-center gap-2 text-xs sm:text-sm font-medium text-violet-700 mb-3">
                  <span class="font-display tabular-nums">Q${String(question.id).padStart(2, '0')}</span>
                  <span aria-hidden="true" class="text-violet-300">·</span>
                  <span>${question.situation}</span>
                </div>

                <h2 class="text-xl sm:text-2xl font-bold leading-[1.45] text-[#1D1338] text-balance">
                  ${question.question}
                </h2>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4">
                ${question.options
                  .map((option) => {
                    const isHighlighted = savedOptionId === option.id;
                    return `
                      <button
                        type="button"
                        data-option-id="${option.id}"
                        data-role="${option.role}"
                        class="option-card group text-left rounded-[24px] p-5 sm:p-7 min-h-[112px] sm:min-h-[168px] flex flex-col justify-between gap-4 border-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-600 focus-visible:ring-offset-2 ${
                          isHighlighted
                            ? 'bg-violet-50 border-violet-600 shadow-[0_14px_30px_-10px_rgba(124,58,237,0.32)]'
                            : 'bg-white border-transparent hover:border-violet-300 hover:bg-violet-50/40 shadow-[0_10px_28px_-14px_rgba(109,40,217,0.14)]'
                        }"
                      >
                        <div class="flex items-center justify-between w-full">
                          <span class="option-badge font-display text-sm font-bold w-8 h-8 rounded-xl inline-flex items-center justify-center transition-colors ${
                            isHighlighted
                              ? 'bg-violet-600 text-white'
                              : 'bg-violet-100 text-violet-700 group-hover:bg-violet-200'
                          }">
                            ${option.id}
                          </span>

                          <span class="option-check w-6 h-6 rounded-full flex items-center justify-center transition-opacity ${
                            isHighlighted ? 'opacity-100 bg-violet-600 text-white' : 'opacity-0'
                          }" aria-hidden="true">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.75" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" />
                            </svg>
                          </span>
                        </div>

                        <p class="text-[15px] sm:text-base font-medium leading-[1.6] text-[#2C224A]">
                          ${option.text}
                        </p>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          </section>
        `;

        const prevBtn = document.getElementById('prev-question-btn');
        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            if (state.isTransitioning || state.currentIndex === 0) return;
            state.currentIndex -= 1;
            render();
          });
        }

        const optionButtons = mainStage.querySelectorAll('[data-option-id]');
        optionButtons.forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.isTransitioning) return;
            state.isTransitioning = true;

            const optionId = btn.getAttribute('data-option-id');
            const role = btn.getAttribute('data-role');

            optionButtons.forEach((b) => (b.disabled = true));
            btn.classList.remove('border-transparent', 'bg-white');
            btn.classList.add(
              'bg-violet-50',
              'border-violet-600',
              'shadow-[0_14px_30px_-10px_rgba(124,58,237,0.32)]',
              'animate-bounce-select'
            );

            const badge = btn.querySelector('.option-badge');
            const check = btn.querySelector('.option-check');
            if (badge) {
              badge.classList.remove('bg-violet-100', 'text-violet-700');
              badge.classList.add('bg-violet-600', 'text-white');
            }
            if (check) {
              check.classList.remove('opacity-0');
              check.classList.add('opacity-100', 'bg-violet-600', 'text-white');
            }

            setTimeout(() => {
              state.answers[state.currentIndex] = { role, optionId };
              state.isTransitioning = false;
              if (state.currentIndex + 1 < QUIZ_QUESTIONS.length) {
                state.currentIndex += 1;
              } else {
                state.stage = 'result';
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
              render();
            }, 360);
          });
        });
      }

      function renderResultScreen() {
        const result = calculateQuizResult(state.answers.map((a) => a.role));
        const { primary, breakdown } = result;
        const { theme } = primary;

        setPageThemeClass(theme.pageBg);
        headerResetBtn.classList.remove('hidden');

        mainStage.innerHTML = `
          <section aria-label="직무유형 테스트 결과" class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 items-start animate-enter">
            <div class="lg:col-span-7 bg-white rounded-[30px] overflow-hidden ${theme.cardShadow} flex flex-col">
              <div class="${theme.heroBannerBg} px-6 py-7 sm:px-9 sm:py-9 flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                <div class="space-y-3 flex-1">
                  <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold ${theme.accentText}">
                    <span>테스트 결과</span>
                    <span aria-hidden="true" class="${theme.separatorColor}">·</span>
                    <span class="font-display">${primary.englishSubtitle}</span>
                  </div>

                  <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-[1.15] ${theme.headingText} text-balance">
                    ${primary.title}
                  </h1>

                  <p class="text-base sm:text-lg font-bold ${theme.accentText} leading-snug">
                    “${primary.nickname}”
                  </p>
                </div>

                <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-3xl overflow-hidden bg-white/90 p-2 shadow-sm shrink-0 self-center sm:self-auto">
                  ${ROLE_SVGS[primary.role]}
                </div>
              </div>

              <div class="p-6 sm:p-9 flex flex-col gap-6">
                <p class="text-[15px] sm:text-base leading-[1.8] text-[#352C4A]">
                  ${primary.description}
                </p>

                <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1 text-xs sm:text-sm font-medium text-[#5F5380]">
                  <span class="font-semibold ${theme.headingText}">핵심 강점</span>
                  <span aria-hidden="true" class="${theme.separatorColor}">/</span>
                  ${primary.keywords
                    .map(
                      (keyword, index) => `
                        <span class="inline-flex items-center gap-2.5">
                          <span>${keyword}</span>
                          ${
                            index < primary.keywords.length - 1
                              ? `<span aria-hidden="true" class="${theme.separatorColor}">·</span>`
                              : ''
                          }
                        </span>
                      `
                    )
                    .join('')}
                </div>

                <div class="pt-5 border-t ${theme.divider} space-y-3.5">
                  <h2 class="text-sm font-bold ${theme.headingText}">
                    12개 선택으로 본 나의 일하는 스타일 비율
                  </h2>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
                    ${breakdown
                      .map((item) => {
                        const isTop = item.role === primary.role;
                        return `
                          <div class="space-y-1.5">
                            <div class="flex items-center justify-between text-xs sm:text-sm">
                              <span class="${isTop ? `font-bold ${theme.accentText}` : 'font-medium text-[#52476E]'}">
                                ${item.title}
                              </span>
                              <span class="font-display tabular-nums ${isTop ? `font-bold ${theme.accentText}` : 'font-medium text-[#6B6088]'}">
                                ${item.percentage}%
                              </span>
                            </div>
                            <div class="w-full h-2.5 ${theme.barTrack} rounded-full overflow-hidden">
                              <div class="h-full rounded-full transition-all duration-500 ${isTop ? theme.barFill : theme.barSecondary}" style="width: ${Math.max(item.percentage, 6)}%"></div>
                            </div>
                          </div>
                        `;
                      })
                      .join('')}
                  </div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-5 bg-white rounded-[30px] p-6 sm:p-9 ${theme.cardShadow} flex flex-col gap-6">
              <div class="space-y-1.5">
                <p class="text-xs sm:text-sm font-semibold ${theme.accentText}">1학년 로드맵</p>
                <h2 class="text-xl sm:text-2xl font-bold ${theme.headingText}">추천 자격증 · 과목 3가지</h2>
              </div>

              <ol class="divide-y ${theme.divider}">
                ${primary.recommendations
                  .map(
                    (rec, index) => `
                      <li class="py-4 first:pt-1 last:pb-1 space-y-1.5">
                        <div class="flex items-center gap-2 text-xs font-semibold ${theme.accentText}">
                          <span class="font-display font-bold tabular-nums">${String(index + 1).padStart(2, '0')}</span>
                          <span aria-hidden="true" class="${theme.separatorColor}">·</span>
                          <span>${rec.kind}</span>
                        </div>
                        <h3 class="text-base font-bold ${theme.headingText}">${rec.title}</h3>
                        <p class="text-sm leading-relaxed text-[#52476E]">${rec.reason}</p>
                      </li>
                    `
                  )
                  .join('')}
              </ol>

              <div class="pt-2 flex flex-col gap-2.5">
                <button
                  id="share-result-btn"
                  type="button"
                  class="btn-bouncy w-full min-h-[52px] px-6 py-3.5 rounded-2xl text-white font-semibold text-base inline-flex items-center justify-center gap-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 whitespace-nowrap shrink-0 ${theme.primaryButton}"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <path stroke-linecap="round" d="m8.59 13.51 6.83 3.98m-.01-10.98-6.82 3.98" />
                  </svg>
                  <span>공유하기</span>
                </button>

                <button
                  id="restart-quiz-btn"
                  type="button"
                  class="btn-bouncy w-full min-h-[48px] px-5 py-3 rounded-2xl font-semibold text-sm inline-flex items-center justify-center gap-2 focus-visible:outline-none focus-visible:ring-2 whitespace-nowrap shrink-0 ${theme.secondaryButton}"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5" />
                  </svg>
                  <span>다시하기</span>
                </button>
              </div>
            </div>
          </section>
        `;

        const shareBtn = document.getElementById('share-result-btn');
        shareBtn.addEventListener('click', async () => {
          const recText = primary.recommendations
            .map((item, idx) => `${idx + 1}. ${item.title} (${item.kind})`)
            .join('\n');

          const summary = `[나에게 맞는 직무유형 테스트 결과]\n직무유형: ${primary.title}\n별명: "${primary.nickname}"\n\n${primary.description}\n\n[추천 자격증 · 과목 3가지]\n${recText}`;

          let copied = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(summary);
              copied = true;
            }
          } catch {
            copied = false;
          }

          if (!copied) {
            try {
              const textarea = document.createElement('textarea');
              textarea.value = summary;
              textarea.setAttribute('readonly', '');
              textarea.style.position = 'fixed';
              textarea.style.opacity = '0';
              document.body.appendChild(textarea);
              textarea.select();
              copied = document.execCommand('copy');
              document.body.removeChild(textarea);
            } catch {
              copied = false;
            }
          }

          if (copied) {
            const originalHtml = shareBtn.innerHTML;
            shareBtn.innerHTML = `
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" />
              </svg>
              <span>결과가 클립보드에 복사되었어요!</span>
            `;
            setTimeout(() => {
              shareBtn.innerHTML = originalHtml;
            }, 2600);
          }
        });

        document.getElementById('restart-quiz-btn').addEventListener('click', resetToStart);
      }

      function render() {
        if (state.stage === 'start') renderStartScreen();
        else if (state.stage === 'quiz') renderQuestionScreen();
        else renderResultScreen();
      }

      brandHomeBtn.addEventListener('click', resetToStart);
      headerResetBtn.addEventListener('click', resetToStart);

      render();
    </script>
  </body>
</html>
